name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check source hygiene
        run: npm run check:source

      - name: Check robots.txt
        run: npm run check:robots

      - name: Lint
        run: npm run lint

      - name: Accessibility lint
        run: npm run lint:a11y

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, pdo_sqlite, sqlite3, xml, xmlwriter
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Prepare Laravel cache directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --fail-on-skipped
