name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Validate Composer files
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Prepare Laravel cache directories
        working-directory: backend
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Run backend tests
        working-directory: backend
        run: php artisan test

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: preflight
    environment: production
    timeout-minutes: 45

    steps:
      - name: Validate deployment secrets
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "Missing required secret: AWS_DEPLOY_ROLE_ARN" >&2
            exit 1
          fi

          if [[ -z "$AWS_EC2_INSTANCE_ID" ]]; then
            echo "Missing required secret: AWS_EC2_INSTANCE_ID" >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Run deployment through Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          TARGET_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Deploying revision: $TARGET_REVISION"
          parameters=$(jq -n \
            --arg command "if ! command -v aws >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y awscli; fi; sudo -u ubuntu bash -lc 'set -Eeuo pipefail; cd /opt/soc5-outbound; git fetch --no-tags --prune origin main; git rev-parse --verify \"$TARGET_REVISION^{commit}\" >/dev/null; git reset --hard \"$TARGET_REVISION\"; env TARGET_REVISION=\"$TARGET_REVISION\" bash /opt/soc5-outbound/deploy/deploy-production.sh'" \
            '{commands: [$command], executionTimeout: ["2400"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $command_id"

          # The built-in command-executed waiter gives up after a short fixed
          # number of attempts even though the remote command is still active.
          # Poll until SSM reports a terminal state so a workflow rerun cannot
          # overlap an orphaned deployment command.
          status="Pending"
          for attempt in {1..480}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            if (( attempt % 12 == 0 )); then
              echo "SSM deployment is still $status ($((attempt * 5)) seconds elapsed)..."
            fi
            sleep 5
          done

          invocation=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID")

          echo "$invocation" | jq -r '.StandardOutputContent'
          echo "$invocation" | jq -r '.StandardErrorContent' >&2

          status=$(echo "$invocation" | jq -r '.Status')
          if [[ "$status" != "Success" ]]; then
            echo "Deployment failed with SSM status: $status" >&2
            exit 1
          fi
