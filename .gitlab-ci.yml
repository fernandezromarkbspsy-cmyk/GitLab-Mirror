stages:
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

frontend:
  stage: test
  image: node:22-bookworm
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check:source
    - npm run check:robots
    - npm run lint
    - npm run lint:a11y
    - npm run format:check
    - npm test
    - npx playwright install --with-deps chromium
    - npm run test:e2e
    - npm run build

backend:
  stage: test
  image: php:8.3-cli-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git unzip libxml2-dev libonig-dev libsqlite3-dev
    - docker-php-ext-install dom mbstring pdo_sqlite sqlite3
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - rm composer-setup.php
    - cd backend
    - mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
    - composer install --no-interaction --prefer-dist --no-progress
  script:
    - composer validate --no-check-publish
    - vendor/bin/pint --test
    - php artisan test --fail-on-skipped

deploy-production:
  stage: deploy
  image: amazon/aws-cli:2
  resource_group: production
  environment:
    name: production
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  before_script:
    - yum install -y jq
    - test -n "$AWS_DEPLOY_ROLE_ARN"
    - test -n "$AWS_EC2_INSTANCE_ID"
    - test -n "$AWS_DEFAULT_REGION"
    - >-
      read AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<EOF
      $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_DEPLOY_ROLE_ARN"
      --role-session-name "GitLabCI-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
      EOF
    - export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
  script:
    - |
      set -Eeuo pipefail
      echo "Deploying revision: $CI_COMMIT_SHA"
      command_id=$(aws ssm send-command \
        --instance-ids "$AWS_EC2_INSTANCE_ID" \
        --document-name AWS-RunShellScript \
        --comment "Deploy $CI_COMMIT_SHA" \
        --parameters "commands=[\"set -Eeuo pipefail; cd /opt/soc5-outbound; git fetch --no-tags --prune origin main; git rev-parse --verify '$CI_COMMIT_SHA^{commit}' >/dev/null; git reset --hard '$CI_COMMIT_SHA'; env TARGET_REVISION='$CI_COMMIT_SHA' bash /opt/soc5-outbound/deploy/deploy-production.sh\"]" \
        --query 'Command.CommandId' \
        --output text)

      echo "SSM command: $command_id"
      status="Pending"
      for attempt in {1..540}; do
        status=$(aws ssm get-command-invocation \
          --command-id "$command_id" \
          --instance-id "$AWS_EC2_INSTANCE_ID" \
          --query 'Status' \
          --output text 2>/dev/null || echo "Pending")

        case "$status" in
          Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
        esac

        if (( attempt % 12 == 0 )); then
          echo "SSM deployment is still $status ($((attempt * 5)) seconds elapsed)..."
        fi
        sleep 5
      done

      invocation=$(aws ssm get-command-invocation \
        --command-id "$command_id" \
        --instance-id "$AWS_EC2_INSTANCE_ID")

      echo "$invocation" | jq -r '.StandardOutputContent'
      echo "$invocation" | jq -r '.StandardErrorContent' >&2
      status=$(echo "$invocation" | jq -r '.Status')
      if [[ "$status" != "Success" ]]; then
        echo "Deployment failed with SSM status: $status" >&2
        exit 1
      fi
