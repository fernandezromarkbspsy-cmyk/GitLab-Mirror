stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

frontend:
  stage: test
  image: node:22-bookworm
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check:source
    - npm run check:robots
    - npm run lint
    - npm run lint:a11y
    - npm run format:check
    - npm test
    - npx playwright install --with-deps chromium
    - npm run test:e2e
    - npm run build

backend:
  stage: test
  image: php:8.3-cli-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git unzip libxml2-dev libonig-dev libsqlite3-dev
    - docker-php-ext-install dom mbstring
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - rm composer-setup.php
    - cd backend
    - mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
    - composer install --no-interaction --prefer-dist --no-progress
  script:
    - composer validate --no-check-publish
    - vendor/bin/pint --test
    - php artisan test --fail-on-skipped
