services:
  api:
    build: ./backend
    image: soc5-outbound-api:local
    env_file: ./backend/.env
    expose: ["8000"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
  scheduler:
    image: soc5-outbound-api:local
    env_file: ./backend/.env
    command: php artisan schedule:work
    init: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
