[PHP]
extension = curl
extension = fileinfo
extension = mbstring
extension = openssl
extension = pdo_pgsql
extension = pdo_sqlite
extension = pgsql
extension = sodium
extension = sqlite3
extension = zip
date.timezone = Asia/Manila
memory_limit = 256M
max_execution_time = 120
display_errors = On
error_reporting = E_ALL
zend.exception_ignore_args = Off

; Only connect to a debugger when explicitly requested (XDEBUG_TRIGGER).
; Xdebug remains available for manual CLI debugging.
xdebug.start_with_request = trigger
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003

extension=intl

